name: Test and build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI test dependency
        run: python -m pip install PySide6==6.8.3
      - name: Run offline regression tests
        run: python tests/run_tests.py
      - name: Build distribution
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ADSAgent-test-build
          path: dist/ADSAgent-*.zip
          if-no-files-found: error
