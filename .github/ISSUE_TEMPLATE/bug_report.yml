name: 崩溃 / 报错反馈
description: 插件崩溃、卡死、工具报错时用它——报告由插件自动生成并已脱敏
title: "[崩溃] 现象一句话 — v版本号"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 怎么用

        正常情况**不用手填这个表单**：插件在崩溃/卡死后会弹窗询问，选「打开 GitHub 填写」
        就会带着已脱敏的报告预填好本页；无人值守时（设置里开了「自动打开浏览器」）也会自动打开。

        也可以随时在面板里点「生成当前状态报告」重新生成一份。

        报告里**已经去掉**：API 密钥与令牌、本机绝对路径、你的设计/工程名与元件、对话内容。
        提交前请扫一眼下方内容——万一还有你不想公开的信息，直接删掉那一段即可。

  - type: textarea
    id: symptoms
    attributes:
      label: 现象
      description: 尽量写清楚"我在做什么 → 期望什么 → 实际发生了什么"。插件预填时会自动带上版本与环境。
      placeholder: |
        例：刚装上 1.3.2，打开面板点"新建项目"后，所有工具都返回 HTTP 500。
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 异常 / 错误信息
      description: 完整的报错文本或异常栈。没有就写「无」。
      render: text
      placeholder: |
        Traceback (most recent call last):
          ...
        ModuleNotFoundError: No module named 'xxx'
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 上下文
      description: 触发时使用的工具名、页面名、操作步骤等（不含设计内容）。
      placeholder: |
        工具：build_gate
        操作：先 plan_layout 再 build_gate
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: 故障类型
      options:
        - 崩溃（进程退出 / 弹异常框）
        - 卡死（界面长时间无响应）
        - 工具报错（可继续操作，但某个功能不对）
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 最近日志（已脱敏）
      description: 插件自动附上；留空也可以，开发者会按需向你索要完整日志。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认上面内容不含密钥、公司内部工程名或不想公开的资料
          required: true
