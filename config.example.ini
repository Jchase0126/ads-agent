; ADS Agent 共享配置 —— 复制为 config.ini 后填写
; 该文件同时被后端 (backend/) 和 ADS 端插件 (addon/ads_agent) 读取

[llm]
; OpenAI 兼容接口地址（GLM / DeepSeek / OpenAI / Ollama 均可）
; 智谱 GLM:   https://open.bigmodel.cn/api/paas/v4
; DeepSeek:   https://api.deepseek.com
; OpenAI:     https://api.openai.com/v1
base_url = https://open.bigmodel.cn/api/paas/v4
model = glm-4.6
; 面板下拉框里的候选模型，逗号分隔（面板里也可手动输入任意模型名）
models = glm-4.6, glm-4.5, glm-4-flash, deepseek-chat
; API Key；留空则从环境变量 ADS_AGENT_API_KEY 读取
api_key =
; 深度思考：auto=智谱官方接口自动开启 / on=始终请求（服务不支持会自动降级重试）
;           off=关闭。开启后模型的思考过程会显示在面板「思考」折叠行里
thinking = auto

[backend]
host = 127.0.0.1
port = 8760

[ads]
; ADS 端插件工具服务的监听地址（仅本机回环）
host = 127.0.0.1
port = 8761
; 本机回环共享令牌：**留空即可**。
; 首次启动（或运行 install_addon）会自动生成一个随机令牌写回这里，
; 后端与 ADS 插件读的是同一个值；旧的公开默认值 ads-agent-local-token
; 会被自动轮换掉（它等于公开，任何人都能驱动本机接口）。
; 需要重新生成：python backend/ads_auth.py --rotate
token =

[agent]
; 单轮对话中最多允许的工具调用步数（即 LLM 来回的轮数，不是工具调用次数）。
; 太小会在半路掐断需要探索的任务（如建视图 / 放元件 / 调参复测），建议 30~50。
max_tool_steps = 30
; 仿真类工具的等待上限（秒）。会随请求下发给 ADS 端，两端用同一个值。
sim_timeout = 900
; 把耗时仿真移出 ADS 主线程，避免仿真期间界面无响应。
; 打开设计 / 生成网表等必须访问 ADS 数据库的步骤始终留在主线程。
; 若某个 ADS 版本在这一点上有差异（仿真内部又回调 DE），改成 false 可退回
; 主线程串行执行 —— 代价是仿真期间 ADS 界面会卡住。
sim_off_main_thread = true

[ui]
; ADS 启动后自动弹出 Agent 面板
auto_open = true
; 自动弹出的延迟（毫秒），等主窗口就绪
auto_open_delay_ms = 3000
; 界面缩放：留空 = 跟随系统/ADS 字号自动适配；
; 也可手动指定，如 1.15（放大）、0.9（紧凑），范围 0.75 ~ 2.0
scale =
; 界面字体：留空 = 自动挑选（优先 微软雅黑 UI / 苹方 / HarmonyOS Sans / Noto Sans SC）；
; 也可指定任意已安装字体，逗号分隔可写回退链
font_family =
