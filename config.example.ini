; ADS Agent 共享配置 —— 复制为 config.ini 后填写
; 该文件同时被后端 (backend/) 和 ADS 端插件 (addon/ads_agent) 读取

[llm]
; OpenAI 兼容接口地址（GLM / DeepSeek / OpenAI / Ollama 均可）
; 智谱 GLM:   https://open.bigmodel.cn/api/paas/v4
; DeepSeek:   https://api.deepseek.com
; OpenAI:     https://api.openai.com/v1
base_url = https://open.bigmodel.cn/api/paas/v4
model = glm-4.6
; 面板下拉框里的候选模型，逗号分隔（面板里也可手动输入任意模型名）
models = glm-4.6, glm-4.5, glm-4-flash, deepseek-chat
; API Key；留空则从环境变量 ADS_AGENT_API_KEY 读取
api_key =
; 深度思考：auto=智谱官方接口自动开启 / on=始终请求（服务不支持会自动降级重试）
;           off=关闭。开启后模型的思考过程会显示在面板「思考」折叠行里
thinking = auto

[backend]
host = 127.0.0.1
port = 8760

[ads]
; ADS 端插件工具服务的监听地址（仅本机回环）
host = 127.0.0.1
port = 8761
; 本机回环共享令牌：**留空即可**。
; 首次启动（或运行 install_addon）会自动生成一个随机令牌写回这里，
; 后端与 ADS 插件读的是同一个值；旧的公开默认值 ads-agent-local-token
; 会被自动轮换掉（它等于公开，任何人都能驱动本机接口）。
; 需要重新生成：python backend/ads_auth.py --rotate
token =

[agent]
; 单轮对话中最多允许的工具调用步数（即 LLM 来回的轮数，不是工具调用次数）。
; 太小会在半路掐断需要探索的任务（如建视图 / 放元件 / 调参复测），建议 30~50。
max_tool_steps = 30
; 仿真类工具的等待上限（秒）。会随请求下发给 ADS 端，两端用同一个值。
sim_timeout = 900
; 把耗时仿真移出 ADS 主线程，避免仿真期间界面无响应。
; 打开设计 / 生成网表等必须访问 ADS 数据库的步骤始终留在主线程。
; 若某个 ADS 版本在这一点上有差异（仿真内部又回调 DE），改成 false 可退回
; 主线程串行执行 —— 代价是仿真期间 ADS 界面会卡住。
sim_off_main_thread = true
; 取消仿真时给 hpeesofsim 的收尾宽限（秒）：先 terminate，仍在跑才
; taskkill /T 结束**本插件自己 spawn 的**那棵进程树。绝不按进程名批量杀，
; 用户的 ADS 宿主和其它仿真不会被牵连。
sim_cancel_grace_s = 3.0
; ---- 独立计算 worker（run_compute，2026-10-30 起）----
; NumPy/SciPy 优化、拟合、大规模搜索/数据处理由 Agent 自动放进后端的计算
; 子进程执行（工具 run_compute），不占 ADS 主线程 —— 长计算期间界面保持
; 响应，任务可取消、可超时回收。以下参数一般无需修改。
; 同时运行的计算作业上限。
compute_max_workers = 2
; 计算作业排队容量；队列满时 run_compute 立即返回"忙"，可预测拒绝。
compute_queue_capacity = 8
; 单个计算作业默认执行预算（秒），模型可按作业指定，硬上限见下一项。
compute_timeout_s = 600
; 执行预算硬上限（秒）。
compute_max_timeout_s = 7200
; 取消宽限期（秒）：请求停止后先给协作退出的时间，超时才强制结束进程。
compute_cancel_grace_s = 3.0
; 计算子进程解释器：留空用后端自带解释器；若需要独立的 NumPy/SciPy 环境，
; 在这里指向其 python.exe。依赖探测失败会明确报错，不会静默换解释器。
; 示例：compute_python = C:\Python312\python.exe
compute_python =
; 计算作业数据目录（请求/结果/日志）：留空用数据根目录下的 compute_jobs。
compute_base_dir =
; ---- ADS 端工具调度（2026-10-30 起：主线程不再被单个作业拖死）----
; 排队作业数上限，满了直接拒绝（HTTP 503 → 面板提示"忙"），不再无限堆积。
tool_queue_capacity = 64
; 每次 pump() 最多执行的作业数（旧的"按作业数限制"仍然保留）。
pump_max_jobs = 16
; pump() 的软时间预算（毫秒）：本 tick 超预算就停止"启动下一个作业"，
; 把主线程还给 Qt 事件循环。**它只能阻止启动新作业，不能抢占已经在跑的
; 同步处理器** —— 那是 run_compute 的职责。设为 0 表示不限（不推荐）。
pump_time_budget_ms = 8
; 活跃（执行中 / 已转后台，不含排队）作业数上限。与排队容量分开限制，
; 避免"排队没满但并发已经压垮 ADS"的情况。
active_job_limit = 4
; GUI 心跳定时器间隔（毫秒）。由 GUI 线程独立更新（不依赖 pump），
; /health 的 gui_heartbeat_age_ms 据此判断主线程是否疑似被阻塞。
gui_heartbeat_ms = 200

[models]
; 统一模型库目录：上传的原始 ZIP 会备份到这里，其他 Workspace 可从这里导入。
; 留空时首次选择 Workspace 同级的 libraries 并保存位置；之后跨父目录工作区仍复用它。
; 可显式指定绝对路径；更改位置不会自动搬移原目录中的模型包。
; 不要放到 ADS 程序安装目录。环境变量 ADS_AGENT_LIBRARY_ROOT 优先级更高。
library_root =

[datasheet]
; 数据手册 PDF 解析运行时解释器（可选）。
; 后端进程内优先用 PyMuPDF 做完整解析（页树/字体编码/真实页码）；装不了时
; 可在这里指向一个已装 PyMuPDF 的解释器，解析会在子进程里跑同一份代码。
; 留空 = 仅用进程内引擎；两者都不可用时退回受限文本流扫描（会明确标注，
; 且禁止从该结果保存建模参数）。
; 示例：runtime_python = C:\Python312\python.exe
runtime_python =

[ui]
; ADS 启动后自动弹出 Agent 面板
auto_open = true
; 自动弹出的延迟（毫秒），等主窗口就绪
auto_open_delay_ms = 3000
; 界面缩放：留空 = 跟随系统/ADS 字号自动适配；
; 也可手动指定，如 1.15（放大）、0.9（紧凑），范围 0.75 ~ 2.0
scale =
; 界面字体：留空 = 自动挑选（优先 微软雅黑 UI / 苹方 / HarmonyOS Sans / Noto Sans SC）；
; 也可指定任意已安装字体，逗号分隔可写回退链
font_family =

; ---- 跨版本兼容（实验性） ----
; 本插件只对 ADS 2027 完成过实机验收；ADS 2024/2025/2026 为实验性适配
; （已完成官方文档研究与离线验证，未实机验证）。以下开关默认全关。
; 开启实验性开关不代表验证通过；面板标题会继续显示"未实机验证"。
[compat]
; buildInfo.xml 识别失败的 ADS（未知版本）：是否放行写/建图/仿真。
; 默认 false —— 只保留只读能力。
allow_unknown_version = false
; 按年份放行实验性版本的写/建图/仿真工具（逐版本独立开关）。
experimental_2024 = false
experimental_2025 = false
experimental_2026 = false

; ---- 崩溃反馈 ----
; 后端或 ADS 端出问题时，把现场整理成一份报告，配合 GitHub issue 页上报。
; 报告写到本机数据目录（%LOCALAPPDATA%\ADSAgent\feedback）；联网时还会
; 自动上传给作者用于修复崩溃（见下方 auto_upload），本机始终留一份副本。
[feedback]
; 总开关。关闭后不再安装异常钩子、不再生成报告、不再自动上传（心跳仍写，
; 用于判断 ADS 端有没有卡死）。默认开。
enabled = true
; 崩溃时自动用浏览器打开预填好的 GitHub issue 页面（保留作兼容，
; 正常路径已改为后端自动上传，见 auto_upload）。
auto_open_browser = true ;默认开启：崩溃/卡死后自动打开预填页（免勾选）
; 报告里附上最近一段日志。默认开：没有日志的崩溃报告基本没法定位。
include_logs = true
; 附多少行日志（内部会夹到 1..2000 之间）。
max_log_lines = 120
; 卡死判定：ADS 端心跳超过这么多秒没更新就认为卡住了，
; 后端会自动生成一份"卡死"报告。0 = 关闭卡死判定。默认 180。
hang_seconds = 180
; 联网时把脱敏报告自动上传到作者仓库的 Issues（无需用户登录/操作，
; 上传失败不重试，本机副本始终保留）。默认开。
auto_upload = true
; 上传令牌（GitHub PAT，issues 写权限）。留空 = 使用安装包内置令牌；
; 都没有时只保存本机、不上传。一般用户不需要碰这一项。
upload_token =
